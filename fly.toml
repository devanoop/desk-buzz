# Deploy instructions (also see README.md "Deploying" section):
#
#   1. fly launch --no-deploy   (creates the app; when it offers to copy this
#      file's settings, accept — do not let it generate a new fly.toml)
#      Or, if the app already exists: fly apps create deskbuz
#   2. fly postgres create --name deskbuz-db --vm-size shared-cpu-1x --volume-size 1
#      fly postgres attach deskbuz-db --app deskbuz   # wires DATABASE_URL automatically
#   3. fly secrets set CSRF_SECRET=$(openssl rand -hex 32) --app deskbuz
#   4. fly deploy
#
# Update `app` below to match the name you actually created.

app = "deskbuz"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
